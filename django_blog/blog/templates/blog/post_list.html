<h1>Blog Posts</h1>

{% if user.is_authenticated %}
    <a href="{% url 'post-create' %}">New Post</a>
{% endif %}

<hr>

{% for post in posts %}
    <h3>
        <a href="{% url 'post-detail' post.pk %}">
            {{ post.title }}
        </a>
    </h3>
    <p>{{ post.content|truncatewords:20 }}</p>
    <small>By {{ post.author }} on {{ post.published_date }}</small>
    <hr>
{% empty %}
    <p>No posts yet.</p>
{% endfor %}
